<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UDAN PATHSHALA RECEIPT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#ececec;
    padding:20px;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:210mm;
    height:145mm;

    margin:auto;

    background:#fff;

    padding:8mm 10mm;

    position:relative;

    overflow:hidden;

    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* =========================
   LOGO
========================= */

.logo{

    width:90px;

    position:absolute;

    top:10px;
    left:90px;
}

/* =========================
   WATERMARK
========================= */

.watermark{

    position:absolute;

    top:100px;

    left:50%;

    transform:translateX(-50%);

    width:350px;

    opacity:0.05;

    z-index:0;
}

/* =========================
   HEADER
========================= */

h2{

    text-align:center;

    font-size:30px;

    margin-bottom:2px;

    letter-spacing:1px;
}

.address{

    text-align:center;

    font-weight:bold;

    font-size:12px;

    line-height:1.4;

    margin-bottom:12px;
}

/* =========================
   TABLE
========================= */

table{

    width:100%;

    border-spacing:10px;

    position:relative;

    z-index:1;
}

label{

    display:block;

    font-size:13px;

    font-weight:bold;

    margin-bottom:3px;
}

input,
select,
textarea{

    width:100%;

    padding:3px 4px;

    font-size:12px;

    border:none;

    border-bottom:1px solid #777;

    background:transparent;

    outline:none;
}

textarea{

    resize:none;

    height:38px;
}

/* =========================
   PAYMENT DETAILS
========================= */

.payment-details-group{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-top:5px;
}

.payment-details-group > div{

    flex:1;

    min-width:120px;
}

.hidden{

    display:none;
}

/* =========================
   SIGNATURE
========================= */

.signatures{

    margin-top:50px;

    display:flex;

    justify-content:space-between;

    gap:60px;
}

.signature-box{

    width:30%;

    border-top:1px solid #000;

    text-align:center;

    padding-top:5px;

    font-weight:bold;

    font-size:12px;
}

/* =========================
   BUTTONS
========================= */

.buttons{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:15px;
}

button{

    padding:8px 20px;

    font-size:13px;

    border:none;

    border-radius:4px;

    background:#007BFF;

    color:#fff;

    cursor:pointer;
}

button:hover{

    background:#0056b3;
}

/* =========================
   PRINT STYLE
========================= */

@page{

    size:A4 portrait;
    margin:0;
}

@media print{

    html,
    body{

        width:210mm;
        height:145mm;

        margin:0 !important;
        padding:0 !important;

        background:#fff;
    }

    body{

        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .buttons{

        display:none;
    }

    .container{

        width:210mm;
        height:145mm;

        margin:0;

        padding:8mm 10mm;

        box-shadow:none;

        border:none;

        overflow:hidden;

        position:absolute;

        top:0;
        left:0;
    }

    .watermark{

        opacity:0.05 !important;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <img src="123456.jpg" class="logo">

    <!-- WATERMARK -->

    <img src="123456.jpg" class="watermark">

    <!-- HEADER -->

    <h2>UDAN PATHSHALA</h2>

    <div class="address">

        G.T ROAD, PARBIRHATA CROSSING, SRIPALLY,
        PURBA BARDHAMAN - 03 <br>

        Phone: +91 8101614320 |
        Email: udanpathshala@gmail.com

    </div>

    <!-- FORM -->

    <form id="receiptForm">

        <table>

            <tr>

                <td>

                    <label>Payer's Name</label>

                    <input type="text">

                </td>

                <td>

                    <label>Purpose</label>

                    <input type="text">

                </td>

            </tr>

            <tr>

                <td>

                    <label>Payer's Phone No</label>

                    <input type="text">

                </td>

                <td>

                    <label>Payment Date</label>

                    <input type="date" id="paymentDate">

                </td>

            </tr>

            <tr>

                <td>

                    <label>Total Amount</label>

                    <input 
                    type="number"
                    id="totalAmount"
                    oninput="calculateReceiving()">

                </td>

                <td>

                    <label>Receipt No</label>

                    <input type="text">

                </td>

            </tr>

            <tr>

                <td>

                    <label>Payer's Address</label>

                    <textarea></textarea>

                </td>

                <td>

                    <label>Adjustment Amount</label>

                    <input 
                    type="number"
                    id="adjustmentAmount"
                    oninput="calculateReceiving()">

                </td>

            </tr>

            <tr>

                <td>

                    <label>paying Amount</label>

                    <input 
                    type="number"
                    id="receivingAmount"
                    readonly>

                </td>

                <td>

                    <label>Payment Method</label>

                    <select id="paymentMethod"
                    onchange="showPaymentFields()">

                        <option value="cash">Cash</option>

                        <option value="upi">UPI</option>

                        <option value="netbanking">Net Banking</option>

                        <option value="cheque">Cheque</option>

                    </select>

                </td>

            </tr>

        </table>

        <!-- UPI -->

        <div id="upiFields"
        class="hidden payment-details-group">

            <div>

                <label>UPI ID</label>

                <input type="text">

            </div>

            <div>

                <label>UPI Transaction ID</label>

                <input type="text">

            </div>

        </div>

        <!-- NET BANKING -->

        <div id="netbankingFields"
        class="hidden payment-details-group">

            <div>

                <label>Net Banking Transaction ID</label>

                <input type="text">

            </div>

        </div>

        <!-- CHEQUE -->

        <div id="chequeFields"
        class="hidden payment-details-group">

            <div>

                <label>Cheque No</label>

                <input type="text">

            </div>

            <div>

                <label>Cheque Owner Name</label>

                <input type="text">

            </div>

            <div>

                <label>Cheque Owner Phone No</label>

                <input type="text">

            </div>

        </div>

        <!-- SIGNATURES -->

        <div class="signatures">

            <div class="signature-box">

                Payer's Signature

            </div>

            <div class="signature-box">

                Official Stamp

            </div>

            <div class="signature-box">

                Receiver's Signature

            </div>

        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button type="button" onclick="printPage()">

                Print

            </button>

            <button type="button" onclick="clearFormData()">

                Clear Form

            </button>

        </div>

    </form>

</div>

<script>

/* =========================================
   PRINT FUNCTION
========================================= */

function printPage(){

    window.print();
}

/* =========================================
   AUTO DATE
========================================= */

function setTodayDate(){

    const today =
    new Date().toISOString().substr(0,10);

    document.getElementById("paymentDate").value =
    today;
}

/* =========================================
   SHOW PAYMENT FIELDS
========================================= */

function showPaymentFields(){

    const method =
    document.getElementById("paymentMethod").value;

    const upi =
    document.getElementById("upiFields");

    const netbanking =
    document.getElementById("netbankingFields");

    const cheque =
    document.getElementById("chequeFields");

    upi.style.display = "none";
    netbanking.style.display = "none";
    cheque.style.display = "none";

    if(method === "upi"){

        upi.style.display = "flex";
    }

    else if(method === "netbanking"){

        netbanking.style.display = "flex";
    }

    else if(method === "cheque"){

        cheque.style.display = "flex";
    }
}

/* =========================================
   AUTO RECEIVING AMOUNT
========================================= */

function calculateReceiving(){

    const total =
    parseFloat(
    document.getElementById("totalAmount").value
    ) || 0;

    const adjustment =
    parseFloat(
    document.getElementById("adjustmentAmount").value
    ) || 0;

    const receiving =
    total - adjustment;

    document.getElementById("receivingAmount").value =
    receiving.toFixed(2);
}

/* =========================================
   CLEAR FORM
========================================= */

function clearFormData(){

    document.getElementById("receiptForm").reset();

    setTodayDate();

    document.getElementById("receivingAmount").value = "";

    showPaymentFields();
}

/* =========================================
   PAGE LOAD
========================================= */

window.onload = function(){

    setTodayDate();

    showPaymentFields();
}

</script>

</body>
</html>
